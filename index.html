!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Addicted2Sports™ — Expert Picks</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --vault:#08090c;
  --vault-2:#0e1014;
  --panel:#13151a;
  --panel-2:#1a1d24;
  --gold:#d4af37;
  --gold-bright:#f4d35e;
  --gold-dim:#9c7f2c;
  --green:#2fae65;
  --red:#d4453f;
  --slate:#8a8d96;
  --white:#f0eee6;
  --hair:rgba(212,175,55,0.14);
  --hair-strong:rgba(212,175,55,0.28);
}
body{background:radial-gradient(circle at 50% -10%,#15161b,var(--vault) 60%);color:var(--white);font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;min-height:100vh;position:relative;}
body::before{content:'';position:fixed;inset:0;background-image:url('https://raw.githubusercontent.com/addicted2chaddar/a2s-app/main/watermark_tile.png');background-repeat:repeat;background-size:140px 140px;pointer-events:none;z-index:0;}
.header-hero,.container,.footer-btn,.modal,.onboard-overlay{position:relative;z-index:1;}
.bar-divider{display:flex;justify-content:center;gap:3px;padding:10px 0;}
.bar-divider span{width:34px;height:6px;background:linear-gradient(180deg,var(--gold-bright),var(--gold-dim));border-radius:1px;}
.header-hero{background:linear-gradient(180deg,#101218,var(--vault) 85%);border-bottom:1px solid var(--hair-strong);padding:18px 16px 14px;text-align:center;position:relative;}
.logo-image{max-width:100%;height:auto;max-height:108px;border-radius:12px;border:1px solid var(--hair-strong);}
.brand-tagline{font-size:10px;color:var(--gold);letter-spacing:3px;font-weight:600;margin:12px 0 14px;text-transform:uppercase;opacity:0.9;}
.countdown-display{background:var(--panel);border:1px solid var(--hair-strong);border-radius:12px;padding:14px;margin:12px 0;text-align:center;}
.countdown-label{font-size:9px;color:var(--slate);letter-spacing:2px;font-weight:600;text-transform:uppercase;margin-bottom:8px;}
.countdown-timer{font-size:34px;font-weight:700;color:var(--gold-bright);letter-spacing:3px;font-family:'Courier New',monospace;line-height:1;}
.countdown-status{font-size:11px;color:var(--slate);margin-top:8px;font-weight:500;}
.sync-badge{font-size:9px;color:var(--gold-dim);margin-top:4px;}
.header-info{background:var(--panel);border-radius:10px;padding:9px 14px;display:flex;justify-content:center;gap:20px;font-size:12px;border:1px solid var(--hair);margin-top:10px;}
.info-item{display:flex;flex-direction:column;align-items:center;}
.info-label{font-size:9px;color:var(--slate);letter-spacing:0.6px;margin-bottom:3px;text-transform:uppercase;}
.info-value{font-weight:600;color:var(--gold);font-size:13px;}
#victoriaSection{background:var(--panel);border:1px solid var(--hair-strong);border-radius:14px;margin:14px 0 0;padding:14px;text-align:left;}
.agent-picker{display:flex;gap:8px;margin-bottom:10px;}
.agent-pill{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid transparent;opacity:0.5;cursor:pointer;transition:opacity .15s,border-color .15s;}
.agent-pill.active{opacity:1;border-color:var(--gold);}
#victoriaTopBar{display:flex;align-items:center;gap:10px;margin-bottom:10px;cursor:pointer;}
#victoriaFace{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid var(--gold);flex-shrink:0;}
#victoriaTopName{font-size:13px;font-weight:600;color:var(--gold);}
#victoriaTopStatus{font-size:10px;color:var(--green);letter-spacing:0.3px;}
#victoriaTopTag{font-size:10px;color:var(--slate);margin-top:1px;}
#victoriaChat{display:none;flex-direction:column;gap:8px;}
#victoriaChat.open{display:flex;}
#victoriaMessages{overflow-y:auto;display:flex;flex-direction:column;gap:8px;max-height:220px;padding-right:2px;margin-bottom:10px;}
#victoriaMessages::-webkit-scrollbar{width:3px;}
#victoriaMessages::-webkit-scrollbar-thumb{background:var(--hair-strong);border-radius:3px;}
.vic-msg{padding:10px 13px;border-radius:12px;font-size:13px;line-height:1.5;max-width:92%;}
.vic-msg-bot{background:rgba(212,175,55,0.08);border:1px solid var(--hair);color:var(--white);align-self:flex-start;border-radius:4px 12px 12px 12px;}
.vic-msg-user{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:var(--white);align-self:flex-end;border-radius:12px 4px 12px 12px;}
.vic-typing{display:flex;gap:4px;padding:10px 14px;background:rgba(212,175,55,0.06);border-radius:4px 12px 12px 12px;align-self:flex-start;width:fit-content;}
.vic-dot{width:6px;height:6px;background:var(--gold);border-radius:50%;animation:vicDot 1.2s ease-in-out infinite;}
.vic-dot:nth-child(2){animation-delay:0.2s;}
.vic-dot:nth-child(3){animation-delay:0.4s;}
@keyframes vicDot{0%,80%,100%{transform:scale(0.6);opacity:0.4}40%{transform:scale(1);opacity:1}}
#victoriaInputRow{display:flex;gap:8px;}
#victoriaInput{flex:1;padding:10px 13px;background:var(--vault-2);border:1px solid var(--hair-strong);border-radius:10px;color:var(--white);font-size:13px;font-family:inherit;}
#victoriaInput:focus{outline:none;border-color:var(--gold);}
#victoriaSend{padding:10px 14px;background:var(--gold);border:none;border-radius:10px;color:#1a1400;font-weight:700;font-size:15px;cursor:pointer;}
.container{max-width:520px;margin:0 auto;padding:16px;}
.admin-panel{display:none !important;overflow:hidden;}
.admin-panel.active{display:block !important;}
.admin-bar{margin-bottom:18px;padding:12px;background:var(--panel);border-radius:10px;border:1px solid var(--hair-strong);display:flex;justify-content:space-between;align-items:center;}
.timer-controls{background:var(--panel);border:1px solid var(--hair);border-radius:10px;padding:14px;margin-bottom:16px;}
.timer-label{font-size:11px;font-weight:600;color:var(--gold);margin-bottom:10px;text-transform:uppercase;letter-spacing:0.5px;}
.timer-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.timer-btn{padding:10px;background:rgba(212,175,55,0.06);border:1px solid var(--hair-strong);color:var(--gold);border-radius:8px;font-weight:600;font-size:12px;cursor:pointer;text-transform:uppercase;}
.custom-time-row{display:flex;gap:8px;margin-top:8px;}
.custom-time-input{flex:1;padding:10px;background:var(--vault-2);border:1px solid var(--hair-strong);border-radius:8px;color:var(--white);font-size:13px;}
.custom-time-btn{padding:10px 14px;background:rgba(212,175,55,0.1);border:1px solid var(--gold);color:var(--gold);border-radius:8px;font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap;}
.tier-selector{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.tier-btn{padding:14px;border:1px solid var(--hair-strong);background:var(--vault-2);color:var(--white);border-radius:10px;font-weight:600;font-size:12px;cursor:pointer;letter-spacing:0.3px;text-transform:uppercase;}
.tier-btn.active{border-color:var(--gold);background:rgba(212,175,55,0.1);color:var(--gold);}
.form-group{margin-bottom:14px;}
.form-label{display:block;font-size:11px;font-weight:600;color:var(--gold);margin-bottom:7px;letter-spacing:0.5px;text-transform:uppercase;}
.form-input,.form-textarea,.form-select{width:100%;padding:12px 14px;background:var(--vault-2);border:1px solid var(--hair-strong);border-radius:8px;color:var(--white);font-size:13px;font-family:inherit;}
.form-input:focus,.form-textarea:focus,.form-select:focus{outline:none;border-color:var(--gold);}
.form-textarea{resize:vertical;min-height:80px;}
.btn{padding:13px 20px;border:none;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer;letter-spacing:0.3px;text-transform:uppercase;}
.btn-primary{background:linear-gradient(180deg,#3ec97a,#1f7a45);color:#06210f;width:100%;}
.btn-secondary{background:rgba(255,255,255,0.05);color:var(--white);border:1px solid var(--hair-strong);width:100%;margin-top:8px;}
.btn-danger{background:rgba(212,69,63,0.12);color:var(--red);border:1px solid rgba(212,69,63,0.3);width:100%;margin-top:8px;}
.btn-sm{padding:8px 12px;font-size:12px;}
.picks-list{display:none;}
.picks-list.active{display:block;}
.pick-item{background:var(--vault-2);border:1px solid var(--hair-strong);border-radius:10px;padding:14px;margin-bottom:10px;}
.pick-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.pick-team{font-weight:600;color:var(--white);font-size:14px;display:flex;align-items:center;gap:10px;}
.team-logo-sm{width:36px;height:36px;object-fit:contain;flex-shrink:0;background:radial-gradient(circle at 35% 30%, rgba(255,255,255,0.14), rgba(255,255,255,0.04));border-radius:50%;padding:5px;border:1px solid var(--hair-strong);box-shadow:0 2px 6px rgba(0,0,0,0.35);}
.pick-tier-badge{font-size:10px;background:rgba(212,175,55,0.1);color:var(--gold);padding:4px 9px;border-radius:20px;font-weight:600;}
.pick-details{font-size:12px;color:var(--slate);margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--hair);}
.pick-notes{font-size:12px;color:var(--slate);background:rgba(255,255,255,0.03);padding:9px 11px;border-radius:8px;border-left:2px solid var(--gold-dim);}
.result-btns{display:flex;gap:6px;margin-top:8px;}
.result-btn{flex:1;padding:8px;border:none;border-radius:8px;font-weight:600;font-size:11px;cursor:pointer;text-transform:uppercase;}
.result-btn-win{background:rgba(47,174,101,0.15);color:var(--green);border:1px solid rgba(47,174,101,0.4);}
.result-btn-loss{background:rgba(212,69,63,0.15);color:var(--red);border:1px solid rgba(212,69,63,0.4);}
.result-btn-push{background:rgba(138,141,150,0.15);color:var(--slate);border:1px solid rgba(138,141,150,0.4);}
.proof-strip{background:var(--panel);border:1px solid var(--hair-strong);border-radius:14px;padding:14px 16px;margin:14px 0;position:relative;}
.proof-strip-label{font-size:9px;color:var(--gold-dim);font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;}
.proof-ticker{display:flex;gap:6px;overflow:hidden;margin-bottom:12px;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:8px 0;}
.proof-ticker-inner{display:flex;gap:18px;animation:tickerScroll 22s linear infinite;white-space:nowrap;}
.proof-item{font-size:11px;color:var(--gold);font-weight:600;letter-spacing:0.3px;flex-shrink:0;}
.proof-item-v2{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--gold);font-weight:600;flex-shrink:0;white-space:nowrap;}
.proof-item-v2 img{width:16px;height:16px;object-fit:contain;background:rgba(255,255,255,0.08);border-radius:3px;padding:1px;flex-shrink:0;}
@keyframes tickerScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.top-banner-ticker{position:sticky;top:0;z-index:50;background:linear-gradient(90deg,var(--gold-dim),var(--gold-bright),var(--gold-dim));overflow:hidden;white-space:nowrap;padding:7px 0;border-bottom:1px solid var(--gold-bright);}
.top-banner-ticker-inner{display:inline-block;padding-left:100%;animation:topTickerScroll 26s linear infinite;font-size:11px;font-weight:800;color:#06210f;letter-spacing:0.3px;}
.top-banner-ticker-inner span{margin-right:48px;}
@keyframes topTickerScroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
.trust-badges-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0;}
.trust-badge-pill{display:flex;align-items:center;gap:5px;background:rgba(212,175,55,0.08);border:1px solid var(--hair-strong);border-radius:20px;padding:6px 12px;font-size:10px;font-weight:700;color:var(--gold);letter-spacing:0.3px;}
.live-activity-line{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;color:var(--slate);margin:2px 0 12px;}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(47,174,101,0.6);animation:livePulse 1.8s infinite;flex-shrink:0;}
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(47,174,101,0.55);}70%{box-shadow:0 0 0 8px rgba(47,174,101,0);}100%{box-shadow:0 0 0 0 rgba(47,174,101,0);}}
.fan-ticker-strip{background:var(--panel);border:1px solid var(--hair-strong);border-radius:14px;padding:14px 16px;margin:14px 0;}
.fan-ticker{display:flex;gap:6px;overflow:hidden;}
.fan-ticker-inner{display:flex;gap:14px;animation:tickerScroll 24s linear infinite;white-space:nowrap;}
.fan-ticker-item{font-size:11.5px;color:var(--white);background:rgba(47,174,101,0.08);border:1px solid var(--green);border-radius:20px;padding:6px 14px;font-weight:600;}
.proof-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center;}
.proof-stat-val{font-size:22px;font-weight:700;color:var(--gold-bright);line-height:1;}
.proof-stat-lbl{font-size:9px;color:var(--slate);text-transform:uppercase;letter-spacing:0.8px;margin-top:3px;}
.gotm-card{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--gold);border-radius:16px;padding:0;overflow:hidden;margin:16px 0;}
.gotm-header{background:linear-gradient(90deg,var(--gold-dim),var(--gold-bright),var(--gold-dim));padding:9px 16px;text-align:center;}
.gotm-header-text{font-size:11px;font-weight:700;color:#1a1400;letter-spacing:3px;text-transform:uppercase;}
.gotm-body{padding:18px;text-align:center;}
.gotm-badge{display:inline-block;background:rgba(212,175,55,0.1);border:1px solid var(--gold);border-radius:50px;padding:5px 16px;font-size:10px;font-weight:600;color:var(--gold);letter-spacing:1.5px;margin-bottom:12px;}
.gotm-title{font-size:24px;font-weight:700;color:var(--white);line-height:1.2;margin-bottom:6px;text-transform:uppercase;}
.gotm-title span{color:var(--gold-bright);}
.gotm-sub{font-size:11px;color:var(--slate);margin-bottom:14px;line-height:1.7;}
.gotm-green-light{display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(47,174,101,0.08);border:1px solid rgba(47,174,101,0.4);border-radius:8px;padding:8px;margin-bottom:14px;}
.gotm-dot{width:8px;height:8px;border-radius:50%;background:var(--green);}
.gotm-green-text{font-size:11px;font-weight:700;color:var(--green);letter-spacing:1.5px;}
.gotm-price-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px;}
.gotm-price-old{font-size:15px;color:var(--slate);text-decoration:line-through;}
.gotm-price-new{font-size:28px;font-weight:700;color:var(--gold-bright);}
.gotm-save{font-size:10px;background:var(--green);color:#06210f;font-weight:700;padding:3px 9px;border-radius:4px;}
